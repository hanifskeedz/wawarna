function savedP(){return`<div class=pg><h2>Palet Favorit</h2><p>${me?`Masuk sebagai <b>${esc(me.email)}</b> <button class="bt w" data-a=logout>Keluar</button>`:'Masuk dulu untuk melihat palet favoritmu.'}</p><div class=ex id=sv></div></div>`}
async function loadSaved(){if(!me||!ok())return;const{data,error}=await sb.from('palettes').select('id,name,colors').order('created_at',{ascending:false}),o=$('#sv');if(!o)return;o.innerHTML=error?esc(error.message):data.length?data.map(r=>`<div class=cd><div class=ps data-a=use data-c="${esc(r.colors.join(','))}">${r.colors.map(x=>`<i style="background:${esc(x)}"></i>`).join('')}</div><b>${esc(r.name)}</b> <button class="bt w" data-a=rm data-id="${esc(r.id)}" style="padding:2px 8px">🗑️</button></div>`).join(''):'Belum ada palet tersimpan. Buat di Generator lalu tekan ❤️ Simpan.'}
Object.assign(ACT,{
auth:()=>{if(ok())ov(`<h2>Masuk / Daftar</h2><p>Simpan palet favoritmu dan buka dari perangkat mana saja.</p><input id=em type=email placeholder="Email" style="${IN}"><input id=pw type=password placeholder="Kata sandi (min. 6 karakter)" style="${IN}"><p><button class=bt data-a=login>Masuk</button> <button class="bt w" data-a=signup>Daftar</button></p><p id=ae></p>`)},
login:async()=>{const{error}=await sb.auth.signInWithPassword(cred());if(error)$('#ae').textContent=error.message;else{$('.ov')?.remove();toast('Berhasil masuk')}},
signup:async()=>{const{data,error}=await sb.auth.signUp(cred());if(error)$('#ae').textContent=error.message;else if(!data.session)$('#ae').textContent='Cek emailmu untuk konfirmasi, lalu masuk.';else{$('.ov')?.remove();toast('Akun dibuat')}},
logout:async()=>{await sb.auth.signOut();toast('Sudah keluar');location.hash='#/'},
fav:()=>{location.hash='#/saved'},
save:()=>{if(!ok())return;if(!me)return ACT.auth();ov(`<h3>Simpan palet</h3><input id=pn2 maxlength=60 value="Palet ${new Date().toLocaleDateString('id-ID')}" style="${IN}"><p><button class=bt data-a=dosave>❤️ Simpan</button></p>`)},
dosave:async()=>{const name=$('#pn2').value.trim()||'Tanpa nama',{error}=await sb.from('palettes').insert({name,colors:adjd()});if(error)toast(error.message);else{$('.ov')?.remove();toast('Tersimpan ❤️')}},
rm:async t=>{await sb.from('palettes').delete().eq('id',t.dataset.id);loadSaved()}
});
// ===== TEMPEL KODE WARNA =====
const addHex=txt=>{const f=(String(txt).match(/#[0-9a-f]{3,6}\b|\b[0-9a-f]{6}\b/gi)||[]).map(x=>x.replace('#','')).filter(x=>x.length==3||x.length==6).map(x=>'#'+(x.length==3?[...x].map(c=>c+c).join(''):x).toUpperCase()),u=[...new Set(f)].filter(x=>!S.p.some(c=>c.hx==x)),add=u.slice(0,10-S.p.length);add.forEach(x=>S.p.push(mk(x)));if(add.length&&$('#cols'))paint();if(add.length)toast('Ditambahkan '+add.length+' warna');else toast(f.length?(u.length?'Palet penuh (maks. 10 warna)':'Warna sudah ada di palet'):'Kode warna tidak ditemukan');return add.length};
Object.assign(ACT,{ins:()=>{const i=$('#hx');if(!i)return;if(!i.value.trim())return toast('Tempel kode warna dulu');if(addHex(i.value)){i.value='';i.focus()}}});
document.addEventListener('paste',e=>{const i=$('#hx');if(location.hash!='#/generate'||!i||/INPUT|TEXTAREA/.test(e.target.tagName))return;i.value=e.clipboardData.getData('text').trim();i.focus();e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='hx')ACT.ins()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)ACT[t.dataset.a]?.(t,t.closest('.col')?idx(t):-1)});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&e.target.type=='range'){S.adj[k]=+e.target.value;e.target.parentNode.querySelector('b').textContent=e.target.value;paint()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('.ov,.fs')?.remove();if(e.code=='Space'&&location.hash=='#/generate'&&!$('.ov')&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();ACT.gen()}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.dr');if(!b)return;const c=b.closest('.col'),box=$('#cols'),v=getComputedStyle(box).flexDirection=='column';c.classList.add('lift');
const mv=ev=>{const o=[...box.children].find(k=>{if(k==c)return 0;const r=k.getBoundingClientRect();return v?ev.clientY>r.top&&ev.clientY<r.bottom:ev.clientX>r.left&&ev.clientX<r.right});if(o){const ks=[...box.children];ks.indexOf(o)>ks.indexOf(c)?o.after(c):o.before(c)}},
up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);S.p=[...box.children].map(k=>S.p.find(x=>x.id==k.dataset.id));paint()};addEventListener('pointermove',mv);addEventListener('pointerup',up);e.preventDefault()});
addEventListener('hashchange',route);route();
